[project]
name = "kava-workspace-free"
version = "1.0.0"
description = "Kostenlose, eingeschränkte lokale KaVa Workspace Ausgabe"
authors = [{name = "Kai Valenta", email = "Kava140982@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
kava-free = "bautagebuch.free_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
